# Demo styling only — the look of the bar the GIF records. The shipped format
# lives in tmux/claude-state.conf; this one trades its named colors for a fixed
# dark palette so the recording matches a real themed setup.
set -g status on
set -g status-position bottom
set -g status-style "bg=#0f1c1e,fg=#587b7b"
set -g status-left "#[fg=#50c8a0]#[bg=#0f1c1e]  #S    "
set -g status-left-length 20
set -g status-right ""
set -g window-status-separator ""

setw -g window-status-format "#[bg=#0f1c1e]#[nobold]#{?#{==:#{@claude-state},running},#[fg=#4db2d6]#[bold]#{@claude-spinner} #I  #W,#{?#{==:#{@claude-state},input},#[fg=#ffbf40]#[bold]? #I  #W,#{?#{==:#{@claude-state},permission},#[fg=#ff5757]#[bold]! #I  #W,#{?#{==:#{@claude-state},done},#[fg=#50c8a0]#[nobold]✓ #I  #W,#[fg=#587b7b]  #I  #W}}}}    "
setw -g window-status-current-format "#[bg=#1d3438] #{?#{==:#{@claude-state},running},#[fg=#4db2d6]#[bold]#{@claude-spinner} #I  #W,#{?#{==:#{@claude-state},input},#[fg=#ffbf40]#[bold]? #I  #W,#{?#{==:#{@claude-state},permission},#[fg=#ff5757]#[bold]! #I  #W,#{?#{==:#{@claude-state},done},#[fg=#50c8a0]#[nobold]✓ #I  #W,#[fg=#9ee8e2]#[bold]  #I  #W}}}} #[bg=#0f1c1e]   "
